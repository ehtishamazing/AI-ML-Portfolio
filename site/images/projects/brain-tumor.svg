<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="100%" stop-color="#020912" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0a5b0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bg-grad)" />
  
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03" />
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)" />
  
  <circle cx="960" cy="460" r="300" fill="none" stroke="#C7243C" stroke-width="1" opacity="0.2" />
  <circle cx="960" cy="460" r="280" fill="none" stroke="#C7243C" stroke-width="2" stroke-dasharray="20 40" opacity="0.4" />
  
  <!-- Icon (Brain / Neural / Scanning) -->
  <g transform="translate(860, 360) scale(4)" fill="none" stroke="#C7243C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M12 4c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8z" opacity="0.3"/>
    <path d="M9.5 9.5c.8-1 2.2-1 3 0" />
    <path d="M8 13c1.5-1.5 4.5-1.5 6 0" />
    <circle cx="12" cy="12" r="1.5" />
    <!-- Scanner frame -->
    <path d="M3 7v-4h4" opacity="0.5"/>
    <path d="M17 3h4v4" opacity="0.5"/>
    <path d="M21 17v4h-4" opacity="0.5"/>
    <path d="M7 21H3v-4" opacity="0.5"/>
  </g>
  
  <text x="960" y="740" font-family="'Arial', sans-serif" font-weight="900" font-size="64" fill="url(#text-grad)" text-anchor="middle" letter-spacing="0.15em">BRAIN TUMOR DETECTION</text>
  <text x="960" y="820" font-family="'Arial', sans-serif" font-weight="400" font-size="24" fill="#C7243C" text-anchor="middle" letter-spacing="0.3em">YOLOv11 / CV / SAM2</text>
</svg>
