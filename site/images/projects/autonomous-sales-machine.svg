<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="100%" stop-color="#020912" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0a5b0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />
  
  <!-- Subtle UI Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03" />
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)" />
  
  <!-- Accent shapes -->
  <circle cx="960" cy="460" r="300" fill="none" stroke="#C7243C" stroke-width="1" opacity="0.2" />
  <circle cx="960" cy="460" r="280" fill="none" stroke="#C7243C" stroke-width="2" stroke-dasharray="15 30" opacity="0.4" />
  
  <!-- Icon (Network / AI Bot) -->
  <g transform="translate(860, 360) scale(4)" fill="none" stroke="#C7243C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" opacity="0.3"/>
    <rect x="5" y="8" width="14" height="10" rx="2" />
    <path d="M12 4v4" />
    <path d="M9 12h.01M15 12h.01" stroke-width="2" />
  </g>
  
  <!-- Title -->
  <text x="960" y="740" font-family="'Arial', sans-serif" font-weight="900" font-size="64" fill="url(#text-grad)" text-anchor="middle" letter-spacing="0.15em">AUTONOMOUS SALES MACHINE</text>
  
  <!-- Subtitle -->
  <text x="960" y="820" font-family="'Arial', sans-serif" font-weight="400" font-size="24" fill="#C7243C" text-anchor="middle" letter-spacing="0.3em">N8N / RAG / AUTOMATION</text>
</svg>
