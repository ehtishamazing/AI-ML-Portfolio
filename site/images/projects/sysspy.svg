<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="100%" stop-color="#020912" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0a5b0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bg-grad)" />
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03" />
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)" />
  
  <circle cx="960" cy="460" r="300" fill="none" stroke="#C7243C" stroke-width="1" opacity="0.2" />
  <circle cx="960" cy="460" r="280" fill="none" stroke="#C7243C" stroke-width="2" stroke-dasharray="30 15" opacity="0.4" />
  
  <!-- Icon (Shield / Eye / Spy / System) -->
  <g transform="translate(860, 360) scale(4)" fill="none" stroke="#C7243C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
    <circle cx="12" cy="11" r="3" />
    <path d="M12 11c-1.5 0-2-1-2-1" opacity="0.6"/>
  </g>
  
  <text x="960" y="740" font-family="'Arial', sans-serif" font-weight="900" font-size="64" fill="url(#text-grad)" text-anchor="middle" letter-spacing="0.15em">SYSSPY</text>
  <text x="960" y="820" font-family="'Arial', sans-serif" font-weight="400" font-size="24" fill="#C7243C" text-anchor="middle" letter-spacing="0.3em">OS INTELLIGENCE / SYSTEM CALLS</text>
</svg>
