<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="100%" stop-color="#020912" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0a5b0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bg-grad)" />
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03" />
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)" />
  
  <circle cx="960" cy="460" r="300" fill="none" stroke="#C7243C" stroke-width="1" opacity="0.2" />
  <circle cx="960" cy="460" r="280" fill="none" stroke="#C7243C" stroke-width="2" stroke-dasharray="10 20" opacity="0.4" />
  
  <!-- Icon (Building / Management) -->
  <g transform="translate(860, 360) scale(4)" fill="none" stroke="#C7243C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M3 21v-14l9-6 9 6v14" />
    <rect x="9" y="14" width="6" height="7" />
    <path d="M9 10h.01M15 10h.01" stroke-width="2"/>
    <path d="M9 6h.01M15 6h.01" stroke-width="2"/>
  </g>
  
  <text x="960" y="740" font-family="'Arial', sans-serif" font-weight="900" font-size="64" fill="url(#text-grad)" text-anchor="middle" letter-spacing="0.15em">SMART HOSTEL MANAGEMENT</text>
  <text x="960" y="820" font-family="'Arial', sans-serif" font-weight="400" font-size="24" fill="#C7243C" text-anchor="middle" letter-spacing="0.3em">PHP / MYSQL / RELATIONAL DATABASE</text>
</svg>
